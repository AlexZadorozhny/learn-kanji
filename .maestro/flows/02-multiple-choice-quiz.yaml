appId: com.learn.kanji
name: Multiple Choice Quiz Flow
tags:
  - e2e
  - quiz
  - multiple-choice
---
# Test the multiple choice quiz with auto-advance

- launchApp
- waitForAnimationToEnd

# Navigate to Practice tab
- tapOn:
    id: "tab-practice"
- waitForAnimationToEnd
- assertVisible: "Practice Modes"

# Tap the Multiple Choice button
- assertVisible:
    id: "practice-mode-multiple-choice-button"
- tapOn:
    id: "practice-mode-multiple-choice-button"
- waitForAnimationToEnd

# Wait for quiz screen to load
- assertVisible:
    id: "multiple-choice-container"
- assertVisible: "QUESTION"

# Answer 10 questions (or until session ends)
- repeat:
    times: 10
    commands:
      # Wait for question to load
      - assertVisible:
          id: "multiple-choice-option-0"

      # Tap the first option (we're not aiming for correctness, just flow)
      - tapOn:
          id: "multiple-choice-option-0"

      # Wait for feedback animation (1.5s auto-advance)
      - waitForAnimationToEnd

      # If still in quiz, continue; otherwise, we've reached results
      - runFlow:
          when:
            visible:
              id: "multiple-choice-container"
          commands:
                        - waitForAnimationToEnd

# Verify results screen appears
- assertVisible:
    id: "results-scroll-view"
- assertVisible: "Session Complete!"

# Verify session statistics
- assertVisible: "Correct"
- assertVisible: "Accuracy"

# Return to practice mode
- tapOn:
    id: "results-back-button"
- waitForAnimationToEnd

# Verify we're back at practice mode
- assertVisible: "Practice Modes"
